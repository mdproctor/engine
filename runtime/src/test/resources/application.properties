# Quarkus index-dependency: library JARs without Quarkus extension descriptors
# need explicit indexing so their CDI beans are discovered.
quarkus.index-dependency.scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz
# persistence-memory provides DefaultTestPrincipal (@DefaultBean CurrentPrincipal).
# Its SPI implementations are @Alternative and only activate when selected-alternatives
# is configured (memory profile). Indexed here for all profiles.
quarkus.index-dependency.persistence-memory.group-id=io.casehub
quarkus.index-dependency.persistence-memory.artifact-id=casehub-engine-persistence-memory
quarkus.index-dependency.persistence-hibernate.group-id=io.casehub
quarkus.index-dependency.persistence-hibernate.artifact-id=casehub-engine-persistence-hibernate

# Disable Ollama Dev Services — model preloading is not needed for tests
quarkus.langchain4j.ollama.devservices.enabled=false

# Quartz: use in-memory store (no database connection needed)
quarkus.quartz.store-type=ram
quarkus.quartz.clustered=false

# Explicit db-kind prevents DevServices ambiguity when quarkus-jdbc-h2 is also on the
# classpath. The memory Surefire execution overrides this via application-memory.properties.
quarkus.datasource.db-kind=postgresql

# Dev Services: do not keep Testcontainers databases alive after Maven test runs.
quarkus.datasource.devservices.reuse=false
# Create the casehub_crosstenancy role before Hibernate sets up the schema.
# Required by withCrossTenantTransaction() which issues SET LOCAL ROLE casehub_crosstenancy.
# In production this role is created by RlsPolicyApplicator (casehub.rls.enabled=true).
quarkus.datasource.devservices.init-script-path=db/init-crosstenancy-role.sql
# Worker execution: short timeout for faster tests
casehub.engine.worker.default-timeout-ms=2000

# Context diff strategy: explicit top-level for end-to-end tests (none is the production default)
casehub.engine.diff-strategy=top-level

# Hibernate ORM: use dedicated JSON mapper, not the REST ObjectMapper customizer.
# Only applies in default test profile (hibernate). Ignored in memory profile.
quarkus.hibernate-orm.mapping.format.global=ignore

# Schema management: drop-and-create so entity changes are always reflected without
# requiring Flyway migrations in engine tests. Flyway migrations are managed by the
# casehub-persistence-hibernate module for production; engine tests use entity-driven schema.
quarkus.flyway.out-of-order=true
quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Index dependency classes for CDI discovery
quarkus.index-dependency.engine-common.group-id=io.casehub
quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
quarkus.index-dependency.casehub-persistence-hibernate.group-id=io.casehub
quarkus.index-dependency.casehub-persistence-hibernate.artifact-id=casehub-engine-persistence-hibernate
quarkus.index-dependency.scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz

# casehub-platform provides DefaultStrategyResolver (@Singleton) — required for routing
# strategy resolution. Must be indexed for CDI discovery.
quarkus.index-dependency.casehub-platform.group-id=io.casehub
quarkus.index-dependency.casehub-platform.artifact-id=casehub-platform
quarkus.index-dependency.casehub-platform-api.group-id=io.casehub
quarkus.index-dependency.casehub-platform-api.artifact-id=casehub-platform-api
quarkus.index-dependency.casehub-engine-api.group-id=io.casehub
quarkus.index-dependency.casehub-engine-api.artifact-id=casehub-engine-api

# RAG expansion: rag-testing provides InMemoryCaseRetriever + InMemoryQueryExpander.
# rag-expansion has its own Jandex index (auto-discovered).
# Decorator activates only when casehub.rag.expansion.enabled=true.
quarkus.index-dependency.rag-testing.group-id=io.casehub
quarkus.index-dependency.rag-testing.artifact-id=casehub-neocortex-rag-testing
casehub.rag.expansion.enabled=true

# CBR in-memory store for integration tests — needs index-dependency for Jandex discovery
quarkus.index-dependency.cbr-inmem.group-id=io.casehub
quarkus.index-dependency.cbr-inmem.artifact-id=casehub-neocortex-memory-cbr-inmem

# NamedStrategy beans must survive build-time pruning — they are only discovered
# via Instance<NamedStrategy> in DefaultStrategyResolver, which Quarkus ARC
# may not detect as a usage during build-time bean removal.
quarkus.arc.unremovable-types=io.casehub.platform.api.routing.NamedStrategy

# casehub-work-core is on the classpath (direct dep). RoundRobinStrategy requires a
# RoutingCursorStore which has no provider in engine tests — exclude it from CDI discovery.
# casehub-platform (compile dep) pulls in MockCurrentPrincipal (@DefaultBean CurrentPrincipal).
# casehub-engine-persistence-memory (test dep) provides DefaultTestPrincipal (@DefaultBean).
# Both are @DefaultBean — ARC cannot resolve the ambiguity. Exclude MockCurrentPrincipal so
# DefaultTestPrincipal wins in all test profiles.
quarkus.arc.exclude-types=\
  io.casehub.work.core.strategy.RoundRobinStrategy,\
  io.casehub.platform.mock.MockCurrentPrincipal,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture

# casehub-ledger is on the engine classpath (via LedgerTraceIdProvider) but its JPA-backed
# beans require a LedgerEntryRepository. NoOpLedgerEntryRepository (@Alternative @Priority(1))
# satisfies that dependency so the in-memory test profile starts cleanly.
# CaseLedgerEventCapture/WorkerDecisionEventCapture are excluded: the runtime test schema
# does not include the ledger_subject_sequence table (added in casehub-ledger SNAPSHOT
# post-20260529). These CDI observers are unnecessary for in-memory engine tests.

# ── QuarkusConfigManagerTest fixtures ────────────────────────────────────────
# Moved from application-test.properties: when quarkus.test.profile=memory is active,
# the profile is 'memory' not 'test', so application-test.properties is not loaded.
# These must be in the base application.properties to be available in all profiles.
test.timeout=5000
test.flag=true
test.items=a,b,c
test.number=42
test.string=hello
