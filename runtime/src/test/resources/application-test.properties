# Test configuration for ConfigManager tests
test.timeout=5000
test.flag=true
test.items=a,b,c
test.number=42
test.string=hello

# Config & Secrets examples (used by Phase1IntegrationTest)
# ConfigManager: resolve single values, multi-values, type conversion
# example.timeout=30
# example.retries=3,5,10

# SecretManager: build nested maps from dot-delimited keys
# myservice.apiKey=sk-test-123
# myservice.endpoint=https://api.example.com
# myservice.config.timeout=30  → {apiKey: "...", endpoint: "...", config: {timeout: "30"}}

# Caching: control TTL for secret caching (default PT0S = no caching)
# casehub.config.secrets.cache.ttl=PT5M

# Auditing: control secret access logging (default true)
# casehub.config.audit.secrets=true
