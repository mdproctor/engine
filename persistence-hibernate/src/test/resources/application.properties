# Suppress Hibernate mapping format warnings in tests
%test.quarkus.hibernate-orm.mapping.format.global=ignore

%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.format-sql=true
%test.quarkus.hibernate-orm.log.bind-parameters=true

# Run all Flyway migrations on a fresh database each test run, then validate
# the schema against entity mappings. This catches entity/migration drift early.
# Dev Services provides a disposable Postgres container; clean-at-start resets it.
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.baseline-version=0
%test.quarkus.flyway.baseline-on-migrate=true
%test.quarkus.flyway.out-of-order=true
%test.quarkus.hibernate-orm.schema-management.strategy=validate
%test.quarkus.log.category."org.flywaydb".level=DEBUG

# Index the api module (needed for CaseStatus enum used in entity mappings).
# Do NOT index the engine module: its @Entity classes (CaseMetaModel, CaseInstance, EventLog)
# map to the same tables as our *Entity classes. Indexing both would cause Hibernate to
# discover duplicate entity mappings and fail.
quarkus.index-dependency.api.group-id=io.casehub
quarkus.index-dependency.api.artifact-id=casehub-engine-api

# PostgreSQL session timeouts — prevents connections blocked on lock waits or aborted
# transaction state from hanging indefinitely. lock_timeout fires if a lock cannot
# be acquired in 10s; statement_timeout cancels any statement running > 30s.
# Both return a database-level error, which propagates through Hibernate Reactive,
# unblocks subscribeAndAwait(), and allows the test to fail fast.
%test.quarkus.datasource.reactive.additional-properties.lock_timeout=10000
%test.quarkus.datasource.reactive.additional-properties.statement_timeout=30000

# Backstop: Quarkus hang detection in case no tests run for 60s
quarkus.test.hang-detection-timeout=60s
