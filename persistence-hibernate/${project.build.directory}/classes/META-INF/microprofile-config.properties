quarkus.datasource.db-kind=postgresql

quarkus.scheduler.start-mode=forced
quarkus.quartz.clustered=false
quarkus.quartz.store-type=jdbc-cmt
quarkus.quartz.table-prefix=QRTZ_
quarkus.quartz.misfire-policy.task-job=ignore-misfire-policy

# Flyway manages all tables runs in every profile; Dev Services provides a fresh DB in dev/test
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-version=0
quarkus.flyway.baseline-on-migrate=true

# Hibernate validates schema against Flyway-managed DDL does not create or drop tables
quarkus.hibernate-orm.schema-management.strategy=validate

# Production datasource
%prod.quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casehub}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casehub}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
