$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://casehub.io/schemas/0.1.0/casehub.yaml"
title: "CaseHub"
description: >
  Case Hub schema for coordination and observability of Cases.

  The Reactor is the minimal core: it manages state, publishes events,
  detects milestones, and provides observability. It does NOT initiate
  work, assign tasks, or make decisions on behalf of participants.

  Workers are autonomous participants. They observe CaseContext and events,
  make local decisions, and act based on their own capabilities.

  Case Hub is choreography-oriented by default.
type: object
required: [ dsl, namespace, name, version, spec ]
unevaluatedProperties: true

properties:
  dsl:
    type: string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    title: CaseHubDSL
    minLength: 1
    maxLength: 50
    description: The version of the DSL used by the CaseHub.
  expressionLang:
    type: string
    title: ExpressionLang
    minLength: 1
    maxLength: 64
    default: "jq"
    description: >
      Expression language for all condition expressions in this definition.
      Must match the type() of a registered ExpressionEngine that overrides create().
      Defaults to "jq". Constraint: expressionLang == ExpressionEvaluator.type() == ExpressionEngine.type().
  namespace:
    type: string
    pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
    title: CaseHubNamespace
    minLength: 1
    maxLength: 255
    description: The CaseHub's namespace.
  name:
    type: string
    pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
    title: CaseHubName
    minLength: 1
    maxLength: 255
    description: The CaseHub's name.
  version:
    type: string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    title: CaseHubVersion
    minLength: 1
    maxLength: 50
    description: The CaseHub's semantic version.
  title:
    type: string
    title: CaseHubTitle
    minLength: 0
    maxLength: 500
    description: The CaseHub's title.
  summary:
    type: string
    title: CaseHubSummary
    description: The CaseHub's Markdown summary.
  types:
    type: array
    title: CaseHubTypes
    description: >
      Behavioral type classifications for this case definition.
      Each entry is a hierarchical path string parsed via Path.parse().
      Types affect engine behavior — routing, dispatch, completion strategy.
    items:
      type: string
      minLength: 1
  labels:
    type: array
    title: CaseHubLabels
    description: >
      Operational classification labels for this case definition.
      Each entry is a hierarchical path string parsed via Path.parse().
      Labels affect organization — queues, dashboards, analytics.
    items:
      type: string
      minLength: 1
  use:
    $ref: "#/$defs/Use"
    description: >
      Declares external dependencies (secrets, config maps) required by this Case definition.
      Secrets are validated at load time for fail-fast behavior.
      ConfigMaps provide non-sensitive configuration accessible via ${$config.*} in JQ.
  semanticData:
    type: object
    additionalProperties: true
    description: Static domain knowledge injected into the semantic layer at case start
  episodic:
    type: object
    description: Episodic memory configuration for this case definition
    unevaluatedProperties: false
    properties:
      memory:
        type: object
        required:
          - domain
          - entityId
        unevaluatedProperties: false
        properties:
          domain:
            type: string
            description: MemoryDomain name (e.g. "fraud-check")
          entityId:
            type: string
            description: JQ expression evaluated against semantic layer to resolve entity ID(s)
          recent:
            type: integer
            default: 10
            minimum: 1
            description: Max items to return; default 10
  layers:
    type: array
    description: User-defined layer names for this case definition
    items:
      type: object
      required:
        - name
      unevaluatedProperties: false
      properties:
        name:
          type: string
          description: User-defined layer name
  spec:
    $ref: "#/$defs/CaseDefinitionSpec"
$defs:
  Use:
    type: object
    description: >
      External dependencies declaration (secrets and config maps).
      Inspired by CNCF Serverless Workflow 'use' section.

      Secrets are validated at load time via SecretManager.secret() for fail-fast behavior.
      ConfigMaps are validated via ConfigManager for availability.
    unevaluatedProperties: false
    properties:
      secrets:
        type: array
        description: >
          Secret names required by this Case definition.
          Validated at load time via SecretManager.secret().
          Accessible in JQ expressions via ${$secret.{name}.{property}}

          Example configuration (application.properties):
            openai.apiKey=sk-...
            openai.organizationId=org-...

          Example usage in YAML:
            use:
              secrets:
                - openai
            spec:
              workers:
                - agent:
                    model:
                      openai:
                        apiKey: "${$secret.openai.apiKey}"
        items:
          type: string
          pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
          minLength: 1
          maxLength: 63
        uniqueItems: true

      configMaps:
        type: array
        description: >
          Config map names required by this Case definition.
          Validated at load time via ConfigManager - checks that properties with
          {configMapName}. prefix exist.
          Accessible in JQ expressions via ${$config.{name}.{property}}

          ConfigMaps provide non-sensitive configuration data (timeouts, feature flags,
          model parameters, etc.) as opposed to secrets (API keys, credentials).

          Example configuration (application.properties):
            app-config.timeout=5000
            app-config.retries=3
            feature-flags.analyticsEnabled=true

          Example usage in YAML:
            use:
              configMaps:
                - app-config
                - feature-flags
            spec:
              bindings:
                - when: "${$config.featureFlags.analyticsEnabled == 'true'}"
                  capability: send-analytics
        items:
          type: string
          pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
          minLength: 1
          maxLength: 63
        uniqueItems: true

  CaseDefinitionSpec:
    type: object
    unevaluatedProperties: true
    properties:
      milestones:
        type: array
        description: >
          Observable progress markers derived from CaseContext.
          The Reactor evaluates milestone conditions on every context
          change and publishes MilestoneReached events.
          Milestones provide visibility, not control flow.
        items:
          $ref: "#/$defs/Milestone"
      capabilities:
        type: array
        description: >
          Capabilities define what Workers can do.
          A capability is a declared competence with a defined input/output
          contract and shared vocabulary for discovery.
        items:
          $ref: "#/$defs/Capability"
      goals:
        type: array
        description: >
          Desired end-states expressed as JQ predicates over the CaseContext.
          Goals provide outcome-oriented observability and can be used to
          determine Case completion (success/failure), without prescribing
          control flow or assigning work.
        items:
          $ref: "#/$defs/Goal"
      completion:
        $ref: "#/$defs/CaseCompletion"
        description: >
          Defines when a Case instance is considered terminally completed
          (success) or terminally failed based on Goal satisfaction and/or a
          direct JQ predicate. The Reactor evaluates completion on every
          CaseContext change and may emit CaseCompleted/CaseFailed events.
      planningStrategy:
        type: string
        description: >
          Planning strategy for this case. Options: "parallel" (default), "sequential".
          Controls how multiple eligible bindings are scheduled.
      bindings:
        type: array
        description: >
          Bindings connect trigger conditions to worker capabilities. When a binding's
          trigger condition is met, the associated capability is invoked.
        items:
          $ref: "#/$defs/Binding"
      workers:
        type: array
        description: >
          Autonomous participants that observe CaseContext and events,
          make local decisions, and perform work.
        items:
          $ref: "#/$defs/Worker"
      _forceAgent:
        description: "TEMPORARY: forces generation of Agent class"
        $ref: "#/$defs/Agent"
      _forceAgentModel:
        description: "TEMPORARY: forces generation of AgentModel class"
        $ref: "#/$defs/AgentModel"
      _forceOpenAi:
        description: "TEMPORARY: forces generation of OpenAiModel class"
        $ref: "#/$defs/OpenAiModel"
      _forceOllama:
        description: "TEMPORARY: forces generation of OllamaModel class"
        $ref: "#/$defs/OllamaModel"
      _forceAnthropic:
        description: "TEMPORARY: forces generation of AnthropicModel class"
        $ref: "#/$defs/AnthropicModel"
      _forceMistral:
        description: "TEMPORARY: forces generation of MistralAiModel class"
        $ref: "#/$defs/MistralAiModel"
      _forceGoogleAi:
        description: "TEMPORARY: forces generation of GoogleAiGeminiModel class"
        $ref: "#/$defs/GoogleAiGeminiModel"

  Capability:
    description: >
      A capability that a Worker can perform.
      It declares what a Worker is able to do and defines the contract
      (input/output schema) for that capability.
    type: object
    required: [ name ]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        title: CapabilityName
        description: "Unique capability identifier"
      description:
        type: string
        title: CapabilityDescription
        description: "What this capability represents"
      inputSchema:
        { type: string, description: "JQ producing capability input" }
      outputSchema:
        { type: string, description: "JQ producing capability output" }

  HumanTask:
    type: object
    description: >-
      A binding target that creates a WorkItem in casehub-work and resumes the case
      when the WorkItem reaches a terminal state. Inline mode requires title;
      template mode requires templateRef. The two modes are mutually exclusive.
    unevaluatedProperties: false
    oneOf:
      - required: [ title ]
        not: { required: [ templateRef ] }
      - required: [ templateRef ]
        not: { required: [ title ] }
    properties:
      title:
        type: string
        description: "WorkItem title — inline mode"
      templateRef:
        type: string
        description: "WorkItemTemplate reference (UUID or name) — template mode"
      inputMapping:
        type: string
        description: "JQ expression: case context → WorkItem payload"
      outputMapping:
        type: string
        description: "JQ expression: WorkItem resolution → case context updates"
      scope:
        type: string
        description: >-
          Hierarchical scope path for SLA preference resolution
          (e.g. "casehubio/devtown/pr-review"). Null resolves preferences at root scope.
          Follow the platform convention: org / app / case-type.
      candidateGroups:
        oneOf:
          - type: array
            items: { type: string }
            description: "Static list of groups eligible to claim this WorkItem"
          - type: string
            description: "JQ expression resolving to a list of group names from case context (e.g. \".irb.candidateGroups\")"
      candidateUsers:
        oneOf:
          - type: array
            items: { type: string }
            description: "Static list of users eligible to claim this WorkItem"
          - type: string
            description: "JQ expression resolving to a list of user IDs from case context"
      expiresIn:
        type: string
        description: "ISO 8601 duration after which the WorkItem expires (e.g. PT24H)"
      claimDeadlineHours:
        type: integer
        minimum: 1
        description: "Business hours allowed to claim this WorkItem before it escalates"
      expiresAtExpression:
        type: string
        description: >
          JQ expression evaluated against the case context WORKING layer at scheduling time.
          Must produce an ISO-8601 Instant string (e.g. ".indReportingDeadline").
          Validated at YAML load time. Used to enforce an absolute deadline derived from
          domain data (e.g. ae.reportedAt + window) rather than a relative duration from
          WorkItem creation.
      outcomes:
        type: array
        items: { type: string }
        description: "Valid outcome names for this WorkItem (e.g. APPROVED, REJECTED). Enforced at completion by casehub-work."

  Binding:
    type: object
    required: [ on ]
    unevaluatedProperties: false
    oneOf:
      - required: [ capability ]
        not:
          required: [ subCase, humanTask ]
      - required: [ subCase ]
        not:
          required: [ capability, humanTask ]
      - required: [ humanTask ]
        not:
          required: [ capability, subCase ]
    properties:
      name: { type: string }
      on: { $ref: "#/$defs/Trigger" }
      when: { type: string, description: "JQ over context and/or event" }
      capability: { type: string }
      subCase: { $ref: "#/$defs/SubCase" }
      humanTask: { $ref: "#/$defs/HumanTask" }
      conflictResolverStrategy:
        type: string
        enum: [ LAST_WRITER_WINS, FIRST_WRITER_WINS, FAIL, DEEP_MERGE ]
        default: LAST_WRITER_WINS
        description: "Strategy for resolving concurrent writes to the same CaseContext key"
      outcomePolicy:
        $ref: "#/$defs/OutcomePolicy"
      inputSchemaOverride:
        type: string
        description: "JQ expression overriding the capability's inputSchema for this binding. Use for failure cascade scope reduction."
      contextWrite:
        type: object
        additionalProperties: true
        description: "Key-value pairs to write to the case context before dispatching. Prevents condition re-evaluation loops in failure cascades."

  OutcomePolicy:
    type: object
    description: "Policy for handling semantic worker outcomes (DECLINED, FAILED, EXPIRED)"
    unevaluatedProperties: false
    properties:
      onDecline:
        type: string
        enum: [ REROUTE, FAULT ]
        default: REROUTE
        description: "Action when a worker returns DECLINED"
      onFailure:
        type: string
        enum: [ REROUTE, FAULT ]
        default: REROUTE
        description: "Action when a worker returns FAILED"
      onExpired:
        type: string
        enum: [ REROUTE, FAULT ]
        default: REROUTE
        description: "Action when a worker's commitment expires (not yet wired — engine#513)"
      maxRerouteAttempts:
        type: integer
        minimum: 1
        default: 3
        description: "Maximum dispatch+outcome cycles before writing REROUTES_EXHAUSTED"

  Goal:
    type: object
    required: [ name, condition ]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        description: "Unique goal identifier"
      description:
        type: string
      kind:
        type: string
        enum: [ success, failure ]
        default: success
        description: "Success goal contributes to resolution; failure goal contributes to terminal failure"
      condition:
        type: string
        description: "JQ predicate over CaseContext"

  CaseCompletion:
    type: object
    unevaluatedProperties: false
    properties:
      success:
        $ref: "#/$defs/GoalExpression"
      failure:
        $ref: "#/$defs/GoalExpression"
      doneWhen:
        type: string
        description: "Optional JQ predicate over CaseContext as an override/shortcut"

  ContextChangeTrigger:
    type: object
    description: "Fires when CaseContext changes."
    unevaluatedProperties: false
    properties:
      filter:
        type: string
        description: "JQ predicate over { context, event } where event is a synthetic ContextChanged envelope"
      listenLayer:
        type: string
        description: "Optional layer name; if set, binding only re-evaluates when this layer changes"
    additionalProperties: false

  CloudEventTrigger:
    description: "Fires on matching CloudEvents."
    oneOf:
      - type: string
        description: "CloudEvent type exact match"
      - type: object
        required: [ type ]
        unevaluatedProperties: false
        properties:
          type:
            type: string
            description: "CloudEvent type exact match"
          source:
            type: string
            description: "Optional exact match on CloudEvent source"
          subject:
            type: string
            description: "Optional exact match on CloudEvent subject"
          filter:
            type: string
            description: "JQ predicate over { context, event } where event is the CloudEvent envelope"
        additionalProperties: false

  ExecutionPolicy:
    type: object
    unevaluatedProperties: false
    properties:
      timeoutMs:
        type: integer
        minimum: 60000
        description: "Default timeout for a single work execution/invocation"
      retries:
        $ref: "#/$defs/RetryPolicy"
        description: "Default retry policy"

  GoalExpression:
    type: object
    unevaluatedProperties: false
    oneOf:
      - required: [ allOf ]
      - required: [ anyOf ]
    properties:
      allOf:
        type: array
        items: { type: string } # refs to Goal.name
        minItems: 1
      anyOf:
        type: array
        items: { type: string }
        minItems: 1

  Milestone:
    description: >
      Observable progress marker. The Reactor evaluates milestone
      conditions on every context change and publishes MilestoneReached
      events. Milestones provide visibility, not control flow.
    type: object
    required: [ name, condition ]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        title: MilestoneName
        description: "Milestone name"
      description:
        type: string
        title: MilestoneDescription
        description: "What this milestone represents"
      condition:
        type: string
        title: MilestoneCondition
        description: "JQ expression — true means milestone is reached"
      entryCriteria:
        type: string
        description: "JQ predicate — milestone becomes ACTIVE when true (default: always true)"
      slaDuration:
        type: string
        description: "ISO-8601 duration for SLA deadline (e.g. PT2H, PT24H). Must be positive if present."
      slaStartFrom:
        type: string
        enum: [CASE_CREATED, MILESTONE_ACTIVATED, PREVIOUS_MILESTONE_COMPLETED, EVENT_OCCURRED]
        default: MILESTONE_ACTIVATED
        description: "When SLA clock starts. Only CASE_CREATED and MILESTONE_ACTIVATED are currently implemented."

  RetryPolicy:
    type: object
    unevaluatedProperties: false
    properties:
      maxAttempts:
        type: integer
        minimum: 1
        default: 3
        description: "Total attempts including the first one"
      delayMs:
        type: integer
        minimum: 0
        default: 100
        description: "Delay in milliseconds between retry attempts"

  ScheduleTrigger:
    type: object
    description: "Time-based trigger."
    unevaluatedProperties: false
    oneOf:
      - required: [ cron ]
      - required: [ every ]
    properties:
      cron:
        type: string
        description: "Cron expression (define the dialect in docs: e.g. cron/Quartz)."
      every:
        type: string
        description: "ISO-8601 duration, e.g. PT5M."
      timezone:
        type: string
        description: "IANA TZ, e.g. America/Vancouver"
    additionalProperties: false

  Trigger:
    type: object
    description: >
      Defines what the Worker observes. Exactly one of: contextChange, cloudEvent, schedule.
    unevaluatedProperties: false
    oneOf:
      - required: [ contextChange ]
      - required: [ cloudEvent ]
      - required: [ schedule ]
    properties:
      contextChange:
        $ref: "#/$defs/ContextChangeTrigger"
      cloudEvent:
        $ref: "#/$defs/CloudEventTrigger"
      schedule:
        $ref: "#/$defs/ScheduleTrigger"

  SubCase:
    description: >
      Identifies a child case definition to launch as part of a Binding's work.
      When a binding with a subCase is triggered, a child CaseInstance is spawned.
      The parent case can optionally wait for the child to complete (WAITING state)
      and merge the child's final context back into the parent context.
    type: object
    required: [ namespace, name, version ]
    unevaluatedProperties: false
    properties:
      namespace:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        minLength: 1
        maxLength: 255
        description: "Child case definition namespace"
      name:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        minLength: 1
        maxLength: 255
        description: "Child case definition name"
      version:
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
        minLength: 1
        maxLength: 50
        description: "Child case definition semantic version"
      completionStrategy:
        type: string
        enum: [ DEFAULT, CUSTOM ]
        default: DEFAULT
        description: "Strategy for determining when the child case is considered complete"
      waitForCompletion:
        type: boolean
        default: true
        description: "If true, parent transitions to WAITING until child reaches a terminal state"
      inputMapping:
        type: string
        default: "."
        description: "JQ expression to map parent CaseContext to child initial context"
      outputMapping:
        type: string
        description: "Optional JQ expression to map child final context back to parent (null = no merge)"
      maxRecursionDepth:
        type: integer
        minimum: 0
        maximum: 20
        default: 0
        description: "Maximum self-referencing depth. 0 = no recursion (default). N = allow N levels."
      groupId:
        type: string
        minLength: 1
        maxLength: 255
        description: "Groups multiple sub-case spawns under one M-of-N completion policy"
      totalInGroup:
        type: integer
        minimum: 1
        description: "Total children expected in this group"
      requiredCount:
        type: integer
        minimum: 1
        description: "How many must complete to trigger threshold (default: totalInGroup)"
      onThresholdReached:
        type: string
        enum: [ KEEP, CANCEL ]
        default: KEEP
        description: "KEEP leaves remaining children running; CANCEL stops them"

  Worker:
    description: >
      A Worker is an autonomous participant that owns one or more capabilities.
      Workers observe CaseContext and events, make local decisions,
      and perform work independently.

      A Worker may be a person, a service, a workflow, a rule,
      or an autonomous agent.
    allOf:
      - type: object
        required: [ name, capabilities ]
        unevaluatedProperties: false
        properties:
          name:
            type: string
            title: WorkerName
            minLength: 1
            maxLength: 255
            description: "Worker name"
          description:
            type: string
            title: WorkerDescription
            description: "What this worker does"
          capabilities:
            type: array
            title: WorkerCapabilities
            description: "Capabilities this Worker owns and can perform"
            minItems: 1
            items:
              type: string
          executionPolicy:
            $ref: "#/$defs/ExecutionPolicy"
            description: >
              Default execution policy for this Worker. These are defaults and may be
              overridden by workflow/state-specific settings (if present).
          sequence:
            type: array
            description: >
              Sequential composition of other workers. Each step name must reference
              a worker defined earlier in the workers list.
            items:
              type: string
      - anyOf:
          - $ref: "https://raw.githubusercontent.com/serverlessworkflow/specification/main/schema/workflow.yaml"
          - type: string
          - type: object
            required: [ agent ]
            properties:
              agent:
                $ref: "#/$defs/Agent"

  Agent:
    description: >
      AI-powered worker using LangChain4j models. Agents transform input data
      using JQ expressions, invoke an LLM with a system prompt, and transform
      the LLM response back to output data.
    type: object
    required: [ systemPrompt, inputSchema, outputSchema, model ]
    unevaluatedProperties: false
    properties:
      systemPrompt:
        type: string
        description: "System prompt sent to the LLM to define its behavior and context"
      inputSchema:
        type: string
        description: "JQ expression to transform case context into agent input"
      outputSchema:
        type: string
        description: "JQ expression to transform agent output back to case context"
      userMessageTemplate:
        type: string
        description: "Optional template for the user message. Variables are substituted from transformed input."
      model:
        $ref: "#/$defs/AgentModel"

  AgentModel:
    description: "LLM provider configuration. Exactly one provider must be specified."
    type: object
    unevaluatedProperties: false
    oneOf:
      - required: [ openai ]
      - required: [ ollama ]
      - required: [ anthropic ]
      - required: [ mistralAi ]
      - required: [ googleAiGemini ]
    properties:
      openai:
        $ref: "#/$defs/OpenAiModel"
      ollama:
        $ref: "#/$defs/OllamaModel"
      anthropic:
        $ref: "#/$defs/AnthropicModel"
      mistralAi:
        $ref: "#/$defs/MistralAiModel"
      googleAiGemini:
        $ref: "#/$defs/GoogleAiGeminiModel"

  OpenAiModel:
    type: object
    required: [ modelName ]
    unevaluatedProperties: false
    properties:
      apiKey:
        type: string
        description: |
          OpenAI API key.
          Supports JQ expressions: "${$secret.openai.apiKey}"

          Example configuration (application.properties):
            openai.apiKey=sk-...
            openai.organizationId=org-...

          Declare the secret in use.secrets for fail-fast validation:
            use:
              secrets:
                - openai

          The secret is resolved at runtime during JQ expression evaluation.
      modelName:
        type: string
        description: "Model name (e.g., gpt-4, gpt-3.5-turbo)"
      temperature:
        type: number
        minimum: 0.0
        maximum: 2.0
        description: "Sampling temperature (0.0-2.0)"
      maxTokens:
        type: integer
        minimum: 1
        description: "Maximum tokens in the response"
      topP:
