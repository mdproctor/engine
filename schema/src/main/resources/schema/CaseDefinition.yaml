$schema: https://json-schema.org/draft/2020-12/schema
$defs:
  Binding:
    type: object
    properties:
      conflictResolverStrategy:
        type: string
        description: "Conflict resolution strategy for output merging. Default: LAST_WRITER_WINS."
        default: LAST_WRITER_WINS
        enum:
        - LAST_WRITER_WINS
        - FIRST_WRITER_WINS
        - FAIL
        - DEEP_MERGE
      consumes:
        type: string
        description: Input channel name for Exchange data flow.
      contextWrite:
        type: object
        additionalProperties: true
      contingency:
        description: Alternative capability names activated on primary node failure.
        type: array
        items:
          type: string
      executionMode:
        type: string
        enum:
        - TRANSIENT
        - PERSISTENT
        - REINVOKED
        description: "TRANSIENT (fire-and-forget), PERSISTENT (long-running), or REINVOKED\
          \ (re-invoked with state)."
        default: TRANSIENT
      inputProjectionOverride:
        type: string
      lifecycleScope:
        type: string
        enum:
        - BINDING
        - COMPOUND
        - CASE
        description: "Worker lifetime scope: BINDING (single dispatch), COMPOUND,\
          \ or CASE."
        default: BINDING
      name:
        type: string
        description: Binding name — unique within the definition.
      "on":
        $ref: "#/$defs/Trigger"
        description: Trigger condition that activates this binding.
      outcomePolicy:
        $ref: "#/$defs/OutcomePolicy"
        description: "How to handle worker decline, failure, and expiration outcomes."
      participation:
        type: string
        enum:
        - PARTICIPANT
        - COMPANION
        description: PARTICIPANT blocks completion; COMPANION is a sidecar excluded
          from completion.
        default: PARTICIPANT
      permissionIntent:
        description: Declared worker actions for rights classification.
        type: array
        items:
          type: string
      producedKeys:
        description: Context keys this binding is expected to produce — used for expectation
          validation.
        type: array
        items:
          type: string
      produces:
        type: string
        description: Output channel name for Exchange data flow.
      when:
        $ref: "#/$defs/ExpressionOrOverride"
        description: Additional guard condition evaluated after the trigger fires.
      capability:
        type: string
      subCase:
        $ref: "#/$defs/SubCase"
      humanTask:
        $ref: "#/$defs/HumanTask"
      signal:
        type: object
        additionalProperties: true
        description: Context signal payload. Written to the case context when the
          binding fires. No worker dispatch.
      replanAfter:
        type: string
        enum:
        - always
        - conditional
        - never
        description: "Hint for plan adaptation: always, conditional, or never."
        default: conditional
      exchangeProjection:
        oneOf:
        - type: string
        - type: object
          unevaluatedProperties: false
          required:
          - strategy
          properties:
            strategy:
              type: string
            expression:
              type: string
    oneOf:
    - required:
      - capability
    - required:
      - subCase
    - required:
      - humanTask
    - required:
      - signal
    unevaluatedProperties: false
    required:
    - "on"
  Capability:
    type: object
    properties:
      description:
        type: string
      inputProjection:
        type: string
      name:
        type: string
        title: CapabilityName
      outputProjection:
        type: string
      cognitiveDemand:
        type: object
        additionalProperties:
          type: number
          minimum: 0
          maximum: 1
    unevaluatedProperties: false
    required:
    - name
  CaseCompletion:
    type: object
    description: Maps goal kinds to goal expressions. Document order determines evaluation
      priority — first satisfied expression wins.
    properties:
      doneWhen:
        $ref: "#/$defs/ExpressionOrOverride"
        description: "Optional predicate over CaseContext — string or {lang: expr}\
          \ override."
    additionalProperties:
      $ref: "#/$defs/GoalExpression"
  Goal:
    type: object
    properties:
      condition:
        $ref: "#/$defs/ExpressionOrOverride"
        description: JQ predicate over the CaseContext — goal is reached when this
          evaluates to true.
      description:
        type: string
        description: Human-readable goal description.
      kind:
        type: string
        description: "Goal kind label — built-in: \"success\", \"failure\". Custom\
          \ kinds require explicit status."
        default: success
      name:
        type: string
        description: Unique goal name within the definition.
    unevaluatedProperties: false
    required:
    - name
    - condition
  InboundSignalMapping:
    type: object
    properties:
      connectorType:
        type: string
        minLength: 1
      correlation:
        type: string
      correlationResolver:
        type: string
      payload:
        type: string
      signal:
        type: string
        minLength: 1
    unevaluatedProperties: false
    required:
    - signal
    - connectorType
    - correlation
    - payload
  LabelRule:
    type: object
    properties:
      actions:
        type: array
        items:
          type: object
          unevaluatedProperties: false
          oneOf:
          - required:
            - add
          - required:
            - remove
          properties:
            add:
              type: string
            remove:
              type: string
        minItems: 1
      name:
        type: string
        minLength: 1
      when:
        type: string
    unevaluatedProperties: false
    required:
    - name
    - when
    - actions
  Milestone:
    type: object
    properties:
      description:
        type: string
        description: Human-readable milestone description.
      entryCriteria:
        $ref: "#/$defs/ExpressionOrOverride"
        description: JQ predicate — milestone activates when this becomes true.
      name:
        type: string
        description: Unique milestone name within the definition.
        title: MilestoneName
      slaDuration:
        type: string
        description: SLA duration — ISO-8601 format. Fires timeout when exceeded.
      slaStartFrom:
        type: string
        enum:
        - CASE_CREATED
        - MILESTONE_ACTIVATED
        - PREVIOUS_MILESTONE_COMPLETED
        - EVENT_OCCURRED
        description: "When the SLA clock starts. Default: MILESTONE_ACTIVATED."
        default: MILESTONE_ACTIVATED
      condition:
        $ref: "#/$defs/ExpressionOrOverride"
        description: JQ predicate — milestone completes when this becomes true after
          activation.
        title: MilestoneCondition
    unevaluatedProperties: false
    required:
    - name
    - condition
  OutcomePolicy:
    type: object
    properties:
      maxRerouteAttempts:
        type: integer
        default: 3
        minimum: 1
      onDecline:
        type: string
        enum:
        - REROUTE
        - FAULT
        default: REROUTE
      onExpired:
        type: string
        enum:
        - REROUTE
        - FAULT
        default: REROUTE
      onFailure:
        type: string
        enum:
        - REROUTE
        - FAULT
        default: REROUTE
    unevaluatedProperties: false
  Trigger:
    type: object
    description: "Defines what the Worker observes. Exactly one of: contextChange,\
      \ cloudEvent, schedule, scopeActivated."
    unevaluatedProperties: false
    oneOf:
    - required:
      - contextChange
    - required:
      - cloudEvent
    - required:
      - schedule
    - required:
      - scopeActivated
    properties:
      contextChange:
        $ref: "#/$defs/ContextChangeTrigger"
      cloudEvent:
        $ref: "#/$defs/CloudEventTrigger"
      schedule:
        $ref: "#/$defs/ScheduleTrigger"
      scopeActivated:
        $ref: "#/$defs/ScopeActivatedTrigger"
  Use:
    type: object
    properties:
      configMaps:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
        uniqueItems: true
      secrets:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
        uniqueItems: true
    unevaluatedProperties: false
  Worker:
    type: object
    additionalProperties: true
    properties:
      name:
        type: string
        minLength: 1
        title: WorkerName
        maxLength: 255
      description:
        type: string
      capabilities:
        type: array
        minItems: 1
        items:
          type: string
        title: WorkerCapabilities
      executionPolicy:
        $ref: "#/$defs/ExecutionPolicy"
      sequence:
        type: array
        items:
          type: string
      contextType:
        type: string
      outputType:
        type: string
      cost:
        type: number
        minimum: 0
      effect:
        type: object
        additionalProperties:
          type: boolean
      softDependency:
        type: array
        items:
          type: string
    required:
    - name
    - capabilities
  ExpressionOrOverride:
    description: "Expression string or per-expression language override map. Plain\
      \ string uses the definition-level expressionLang. Map syntax overrides: { jq:\
      \ \".expr\" } or { mvel: \"expr\" }."
    oneOf:
    - type: string
    - type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        type: string
  GoalExpression:
    type: object
    unevaluatedProperties: false
    oneOf:
    - required:
      - allOf
    - required:
      - anyOf
    properties:
      allOf:
        type: array
        minItems: 1
        items:
          oneOf:
          - type: string
          - $ref: "#/$defs/GoalExpression"
      anyOf:
        type: array
        minItems: 1
        items:
          oneOf:
          - type: string
          - $ref: "#/$defs/GoalExpression"
  CaseDefinitionSpec:
    type: object
    unevaluatedProperties: true
    description: Case definition specification. unevaluatedProperties is true because
      the spec is an extension point.
    properties:
      agentRouting:
        type: string
        description: Agent routing strategy ID. Selects which worker instance handles
          a task.
      authorization:
        $ref: "#/$defs/Authorization"
        description: ACL grants created when a case of this type is started.
      bindings:
        description: Bindings connect trigger conditions to worker capabilities.
        type: array
        items:
          $ref: "#/$defs/Binding"
      candidateMatching:
        type: string
        description: "Candidate matching strategy ID. Built-in: \"exact\", \"subsumption\"\
          ."
      capabilities:
        description: Capabilities define what Workers can do — declared competences
          with input/output contracts.
        type: array
        items:
          $ref: "#/$defs/Capability"
      channels:
        description: Typed streaming channels for worker-to-worker data flow.
        type: array
        items:
          type: object
          required:
          - name
          - recordType
          unevaluatedProperties: false
          properties:
            name:
              type: string
              minLength: 1
            recordType:
              type: string
              minLength: 1
            transport:
              type: string
              default: in-memory
            scope:
              type: string
              enum:
              - COMPOUND
              - CASE
              default: CASE
      completion:
        $ref: "#/$defs/CaseCompletion"
        description: Defines when a Case is terminally completed or failed based on
          Goal satisfaction.
      decompositionStrategy:
        type: string
        description: "HTN decomposition strategy ID. Default: \"identity\"."
      defaultQuorum:
        type: object
        unevaluatedProperties: false
        description: Default M-of-N multi-party approval configuration for action
          gates.
        required:
        - instances
        - required
        properties:
          instances:
            type: integer
            minimum: 2
          required:
            type: integer
            minimum: 1
          onThresholdReached:
            type: string
            enum:
            - KEEP
            - CANCEL
            default: KEEP
          allowSameAssignee:
            type: boolean
            default: false
      goals:
        description: Desired end-states expressed as predicates over the CaseContext.
        type: array
        items:
          $ref: "#/$defs/Goal"
      goapActions:
        type: array
        description: GOAP action declarations for planning.
        items:
          type: object
          unevaluatedProperties: false
          required:
          - name
          - effects
          properties:
            name:
              type: string
              minLength: 1
            preconditions:
              type: object
              additionalProperties:
                type: boolean
            effects:
              type: object
              additionalProperties:
                type: boolean
            cost:
              type: number
              minimum: 0
              default: 1.0
            benefit:
              type: number
              minimum: 0
              default: 0
            softPreconditions:
              type: object
              additionalProperties:
                type: boolean
      goalToEffectKeys:
        type: object
        description: Maps goal names to sets of GOAP effect keys for planning.
        additionalProperties:
          type: array
          items:
            type: string
      humanTaskContextConstraints:
        type: array
        description: Declarative rules for humanTask candidate filtering and scoring.
        items:
          type: object
          unevaluatedProperties: false
          required:
          - when
          - effect
          properties:
            when:
              $ref: "#/$defs/ExpressionOrOverride"
            effect:
              type: object
              unevaluatedProperties: false
              properties:
                preferGroups:
                  type: array
                  items:
                    type: string
                preferUsers:
                  type: array
                  items:
                    type: string
                excludeGroups:
                  type: array
                  items:
                    type: string
                excludeUsers:
                  type: array
                  items:
                    type: string
            weight:
              type: number
              minimum: 0
              maximum: 1
              default: 1.0
      humanTaskRouting:
        type: string
        description: HumanTask routing strategy ID. Enriches candidate sets with historical
          data.
      humanTaskWorkloadConstraint:
        type: object
        unevaluatedProperties: false
        description: Workload-based constraints for humanTask candidate filtering.
        properties:
          maxActiveTaskCount:
            type: integer
            minimum: 1
          loadBalanceWeight:
            type: number
            minimum: 0
            maximum: 1
      implementationRouting:
        type: string
        description: Implementation routing strategy ID. Selects which binding(s)
          handle a capability.
      maxAdaptations:
        type: integer
        minimum: 1
        description: "Maximum adaptation count per compound before Concede. Default:\
          \ 5."
      maxDecompositionDepth:
        type: integer
        description: "Maximum nesting depth for dynamic decomposition. Default: 3."
        minimum: 1
        maximum: 10
      memoryRetrieval:
        type: object
        unevaluatedProperties: false
        description: Per-case memory retrieval configuration.
        properties:
          enabled:
            type: boolean
            default: true
          maxMemories:
            type: integer
            minimum: 1
          domains:
            type: array
            items:
              type: string
      milestones:
        description: Observable progress markers derived from CaseContext.
        type: array
        items:
          $ref: "#/$defs/Milestone"
      planningConstraints:
        type: object
        unevaluatedProperties: false
        description: Per-case resource constraints for decomposition and pattern execution.
        properties:
          timeBudget:
            type: string
            description: ISO-8601 Duration (e.g. PT30M).
          resourceLimit:
            type: integer
            minimum: 1
          weights:
            type: object
            additionalProperties:
              type: number
          costBudgets:
            type: object
            additionalProperties:
              type: integer
      planningStrategy:
        type: string
        description: "Planning strategy ID. Built-in: \"default\" (choreography),\
          \ \"sequential\"."
      portfolioConfig:
        type: object
        unevaluatedProperties: false
        description: Cascading decomposition strategy configuration.
        properties:
          delegates:
            type: array
            items:
              type: string
          timeouts:
            type: object
            additionalProperties:
              type: integer
      recoveryPolicy:
        type: object
        unevaluatedProperties: false
        description: Per-case multi-level recovery configuration.
        properties:
          maxRetries:
            type: integer
            minimum: 0
            default: 3
          maxRerouteAttempts:
            type: integer
            minimum: 0
            default: 3
          classifierId:
            type: string
          revisionStrategyId:
            type: string
          replanStrategyId:
            type: string
          enabled:
            type: boolean
            default: true
      routingSignalWeights:
        type: object
        additionalProperties:
          type: number
      workerServiceAccountIds:
        type: object
        additionalProperties:
          type: string
        description: Map of worker name to service account ID for tenant-specific
          endpoint resolution.
      workers:
        description: "Autonomous participants that observe CaseContext, make local\
          \ decisions, and perform work."
        type: array
        items:
          $ref: "#/$defs/Worker"
      cbr:
        $ref: "#/$defs/Cbr"
      reflection:
        type: object
        unevaluatedProperties: false
        description: Per-case reflection trigger configuration.
        properties:
          enabled:
            type: boolean
          importanceThreshold:
            type: number
            minimum: 0
            maximum: 10
          maxUnreflectedOutcomes:
            type: integer
            minimum: 1
          maxSourceMemories:
            type: integer
            minimum: 1
          importanceWeights:
            type: object
            additionalProperties:
              type: number
      monitoring:
        type: object
        unevaluatedProperties: false
        description: Per-case expectation tracking configuration.
        properties:
          enabled:
            type: boolean
            default: true
          perCompletionThreshold:
            type: number
            minimum: 0
            maximum: 1
            default: 0.5
          windowSize:
            type: integer
            minimum: 1
            default: 5
      adaptation:
        description: Per-case plan adaptation configuration. String preset or explicit
          object.
        oneOf:
        - type: string
          enum:
          - adaptive
          - conservative
          - "off"
          - progress
        - type: object
          unevaluatedProperties: false
          properties:
            trigger:
              type: string
            optimization:
              type: string
            revision:
              type: string
            threshold:
              type: number
              minimum: 0
              maximum: 1
            metaReasoner:
              type: string
            repair:
              type: string
            contingencyThreshold:
              type: number
              minimum: 0
              maximum: 1
      _codegenOllama:
        description: Code generation directive — ensures OllamaModel type is generated
          by jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/OllamaModel"
      _codegenAnthropic:
        description: Code generation directive — ensures AnthropicModel type is generated
          by jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/AnthropicModel"
      _codegenOpenAi:
        description: Code generation directive — ensures OpenAiModel type is generated
          by jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/OpenAiModel"
      _codegenAgent:
        description: Code generation directive — ensures Agent type is generated by
          jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/Agent"
      _codegenAgentModel:
        description: Code generation directive — ensures AgentModel type is generated
          by jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/AgentModel"
      _codegenGoogleAi:
        description: Code generation directive — ensures GoogleAiGeminiModel type
          is generated by jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/GoogleAiGeminiModel"
      _codegenMistral:
        description: Code generation directive — ensures MistralAiModel type is generated
          by jsonschema2pojo. Not a user-facing property.
        $ref: "#/$defs/MistralAiModel"
  HumanTask:
    type: object
    unevaluatedProperties: false
    description: A binding target that creates a WorkItem in casehub-work and resumes
      the case when the WorkItem reaches a terminal state.
    oneOf:
    - required:
      - title
    - required:
      - titleExpression
    - required:
      - templateRef
    properties:
      title:
        type: string
      titleExpression:
        type: string
      templateRef:
        type: string
      inputMapping:
        type: string
      outputMapping:
        type: string
      scope:
        type: string
      scopeExpression:
        type: string
      candidateGroups:
        oneOf:
        - type: array
          items:
            type: string
        - type: string
      candidateUsers:
        oneOf:
        - type: array
          items:
            type: string
        - type: string
      expiresIn:
        type: string
      expiresInExpression:
        type: string
      claimDeadlineHours:
        type: integer
        minimum: 1
      expiresAtExpression:
        type: string
      outcomes:
        type: array
        items:
          type: string
      payloadType:
        type: string
      resolutionType:
        type: string
  SubCase:
    type: object
    unevaluatedProperties: false
    required:
    - namespace
    - name
    - version
    properties:
      namespace:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
      name:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
      version:
        type: string
        minLength: 1
        maxLength: 50
        pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\\
          d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\\
          +([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
      completionStrategy:
        type: string
        enum:
        - DEFAULT
        - CUSTOM
        default: DEFAULT
      waitForCompletion:
        type: boolean
        default: true
      inputMapping:
        type: string
        default: .
      outputMapping:
        type: string
      maxRecursionDepth:
        type: integer
        minimum: 0
        maximum: 20
        default: 0
      groupId:
        type: string
        minLength: 1
        maxLength: 255
      totalInGroup:
        type: integer
        minimum: 1
      requiredCount:
        type: integer
        minimum: 1
      onThresholdReached:
        type: string
        enum:
        - KEEP
        - CANCEL
        default: KEEP
  CloudEventTrigger:
    description: Fires on matching CloudEvents.
    oneOf:
    - type: string
      description: CloudEvent type exact match
    - type: object
      required:
      - type
      unevaluatedProperties: false
      additionalProperties: false
      properties:
        type:
          type: string
        source:
          type: string
        subject:
          type: string
        filter:
          $ref: "#/$defs/ExpressionOrOverride"
  ScheduleTrigger:
    type: object
    description: Time-based trigger.
    unevaluatedProperties: false
    additionalProperties: false
    oneOf:
    - required:
      - cron
    - required:
      - every
    properties:
      cron:
        type: string
      every:
        type: string
      timezone:
        type: string
  ScopeActivatedTrigger:
    type: object
    unevaluatedProperties: false
    additionalProperties: false
  ContextChangeTrigger:
    type: object
    unevaluatedProperties: false
    additionalProperties: false
    properties:
      filter:
        $ref: "#/$defs/ExpressionOrOverride"
      listenLayer:
        type: string
  ExecutionPolicy:
    type: object
    unevaluatedProperties: false
    properties:
      timeoutMs:
        type: integer
        minimum: 60000
      retries:
        $ref: "#/$defs/RetryPolicy"
  RetryPolicy:
    type: object
    unevaluatedProperties: false
    properties:
      maxAttempts:
        type: integer
        minimum: 1
        default: 3
      delayMs:
        type: integer
        minimum: 0
        default: 100
  Authorization:
    type: object
    unevaluatedProperties: false
    properties:
      read:
        type: array
        items:
          type: string
      write:
        type: array
        items:
          type: string
      admin:
        type: array
        items:
          type: string
      claim:
        type: array
        items:
          type: string
  Cbr:
    type: object
    unevaluatedProperties: false
    required:
    - features
    properties:
      features:
        type: object
        additionalProperties:
          type: string
      weights:
        type: object
        additionalProperties:
          type: number
      topK:
        type: integer
        minimum: 1
        default: 5
      minSimilarity:
        type: number
        minimum: 0
        maximum: 1
        default: 0
      vectorWeight:
        type: number
        minimum: 0
        maximum: 1
        default: 0.5
      domain:
        type: string
        minLength: 1
      caseType:
        type: string
        minLength: 1
      cbrType:
        type: string
        minLength: 1
      timing:
        type: string
        enum:
        - per-evaluation
        - case-lifetime
        default: per-evaluation
      temporalDecayHalfLifeDays:
        type: integer
        minimum: 1
      minCostSamples:
        type: integer
        minimum: 1
  Agent:
    type: object
    unevaluatedProperties: false
    required:
    - systemPrompt
    - inputProjection
    - outputProjection
    - model
    properties:
      systemPrompt:
        type: string
      inputProjection:
        type: string
      outputProjection:
        type: string
      userMessageTemplate:
        type: string
      model:
        $ref: "#/$defs/AgentModel"
  AgentModel:
    type: object
    unevaluatedProperties: false
