type: object
properties:
  dsl:
    type: string
    description: The version of the DSL used by the CaseHub.
    title: CaseHubDSL
    minLength: 1
    maxLength: 50
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\\
      d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\\
      +([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
  inboundMappings:
    description: Inbound connector message to typed case signal mappings.
    type: array
    items:
      $ref: "#/$defs/InboundSignalMapping"
    title: CaseInboundMappings
  labelRules:
    description: Label evaluation rules for case queue management.
    type: array
    items:
      $ref: "#/$defs/LabelRule"
    title: CaseLabelRules
  labels:
    description: Operational classification labels — hierarchical path strings via
      Path.parse().
    type: array
    items:
      type: string
      minLength: 1
    title: CaseHubLabels
  name:
    type: string
    description: The CaseHub's name.
    title: CaseHubName
    minLength: 1
    maxLength: 255
    pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
  namespace:
    type: string
    description: The CaseHub's namespace.
    title: CaseHubNamespace
    minLength: 1
    maxLength: 255
    pattern: "^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
  semanticData:
    type: object
    additionalProperties: true
  signals:
    description: Typed signal declarations for this case definition.
    type: array
    items:
      type: object
      required:
      - name
      - contextType
      unevaluatedProperties: false
      properties:
        name:
          type: string
          minLength: 1
        contextType:
          type: string
          minLength: 1
    title: CaseSignals
  summary:
    type: string
    description: The CaseHub's Markdown summary.
    title: CaseHubSummary
  title:
    type: string
    description: The CaseHub's title.
    title: CaseHubTitle
    maxLength: 500
    minLength: 0
  types:
    description: Behavioral type classifications — hierarchical path strings via Path.parse().
    type: array
    items:
      type: string
      minLength: 1
    title: CaseHubTypes
  use:
    $ref: "#/$defs/Use"
    description: "Declares external dependencies (secrets, config maps) required by\
      \ this Case definition."
  version:
    type: string
    description: The CaseHub's semantic version.
    title: CaseHubVersion
    minLength: 1
    maxLength: 50
    pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\\
      d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\\
      +([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?$"
  spec:
    $ref: "#/$defs/CaseDefinitionSpec"
  episodic:
    type: object
    unevaluatedProperties: false
    properties:
      memory:
        type: object
        required:
        - domain
        - entityId
        unevaluatedProperties: false
        properties:
          domain:
            type: string
          entityId:
            type: string
          recent:
            type: integer
            default: 10
            minimum: 1
  expressionLang:
    type: string
    title: ExpressionLang
    minLength: 1
    maxLength: 64
    default: jq
  contextType:
    type: string
    title: ContextType
    minLength: 1
    maxLength: 512
  layers:
    type: array
    items:
      type: object
      required:
      - name
      unevaluatedProperties: false
      properties:
        name:
          type: string
  context:
    type: object
    unevaluatedProperties: false
    properties:
      storeFactory:
        type: string
unevaluatedProperties: false
required:
- dsl
- namespace
- name
- version
- spec
$id: https://casehub.io/schemas/0.1.0/casehub.yaml
title: CaseHub
