$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://casehub.io/schemas/0.1.0/casehub.yaml"
title: "CaseHub"
description: >
  Case Hub schema for coordination and observability of Cases.

  The Reactor is the minimal core: it manages state, publishes events,
  detects milestones, and provides observability. It does NOT initiate
  work, assign tasks, or make decisions on behalf of participants.

  Workers are autonomous participants. They observe CaseContext and events,
  make local decisions, and act based on their own capabilities.

  Case Hub is choreography-oriented by default.
type: object
required: [ dsl, namespace, name, version, spec ]
unevaluatedProperties: true

properties:
  dsl:
    type: string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    title: CaseHubDSL
    minLength: 1
    maxLength: 50
    description: The version of the DSL used by the CaseHub.
  expressionLang:
    type: string
    title: ExpressionLang
    minLength: 1
    maxLength: 64
    default: "jq"
    description: >
      Expression language for all condition expressions in this definition.
      Must match the type() of a registered ExpressionEngine that overrides create().
      Defaults to "jq". Constraint: expressionLang == ExpressionEvaluator.type() == ExpressionEngine.type().
  namespace:
    type: string
    pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
    title: CaseHubNamespace
    minLength: 1
    maxLength: 255
    description: The CaseHub's namespace.
  name:
    type: string
    pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
    title: CaseHubName
    minLength: 1
    maxLength: 255
    description: The CaseHub's name.
  version:
    type: string
    pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    title: CaseHubVersion
    minLength: 1
    maxLength: 50
    description: The CaseHub's semantic version.
  title:
    type: string
    title: CaseHubTitle
    minLength: 0
    maxLength: 500
    description: The CaseHub's title.
  summary:
    type: string
    title: CaseHubSummary
    description: The CaseHub's Markdown summary.
  types:
    type: array
    title: CaseHubTypes
    description: >
      Behavioral type classifications for this case definition.
      Each entry is a hierarchical path string parsed via Path.parse().
      Types affect engine behavior — routing, dispatch, completion strategy.
    items:
      type: string
      minLength: 1
  labels:
    type: array
    title: CaseHubLabels
    description: >
      Operational classification labels for this case definition.
      Each entry is a hierarchical path string parsed via Path.parse().
      Labels affect organization — queues, dashboards, analytics.
    items:
      type: string
      minLength: 1
  use:
    $ref: "#/$defs/Use"
    description: >
      Declares external dependencies (secrets, config maps) required by this Case definition.
      Secrets are validated at load time for fail-fast behavior.
      ConfigMaps provide non-sensitive configuration accessible via ${$config.*} in JQ.
  semanticData:
    type: object
    additionalProperties: true
    description: Static domain knowledge injected into the semantic layer at case start
  episodic:
    type: object
    description: Episodic memory configuration for this case definition
    unevaluatedProperties: false
    properties:
      memory:
        type: object
        required:
          - domain
          - entityId
        unevaluatedProperties: false
        properties:
          domain:
            type: string
            description: MemoryDomain name (e.g. "fraud-check")
          entityId:
            type: string
            description: JQ expression evaluated against semantic layer to resolve entity ID(s)
          recent:
            type: integer
            default: 10
            minimum: 1
            description: Max items to return; default 10
  layers:
    type: array
    description: User-defined layer names for this case definition
    items:
      type: object
      required:
        - name
      unevaluatedProperties: false
      properties:
        name:
          type: string
          description: User-defined layer name
  signals:
    type: array
    title: CaseSignals
    description: >
      Typed signal declarations for this case definition. Each signal has a name
      and a contextType (fully qualified Java class name). When declared, only
      signals with matching name and payload type are accepted on the typed API.
    items:
      type: object
      required: [name, contextType]
      unevaluatedProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Signal name — must be unique within the definition
        contextType:
          type: string
          minLength: 1
          description: Fully qualified Java class name for the signal payload type
  spec:
    $ref: "#/$defs/CaseDefinitionSpec"
$defs:
  Use:
    type: object
    description: >
      External dependencies declaration (secrets and config maps).
      Inspired by CNCF Serverless Workflow 'use' section.

      Secrets are validated at load time via SecretManager.secret() for fail-fast behavior.
      ConfigMaps are validated via ConfigManager for availability.
    unevaluatedProperties: false
    properties:
      secrets:
        type: array
        description: >
          Secret names required by this Case definition.
          Validated at load time via SecretManager.secret().
          Accessible in JQ expressions via ${$secret.{name}.{property}}

          Example configuration (application.properties):
            openai.apiKey=sk-...
            openai.organizationId=org-...

          Example usage in YAML:
            use:
              secrets:
                - openai
            spec:
              workers:
                - agent:
                    model:
                      openai:
                        apiKey: "${$secret.openai.apiKey}"
        items:
          type: string
          pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
          minLength: 1
          maxLength: 63
        uniqueItems: true

      configMaps:
        type: array
        description: >
          Config map names required by this Case definition.
          Validated at load time via ConfigManager - checks that properties with
          {configMapName}. prefix exist.
          Accessible in JQ expressions via ${$config.{name}.{property}}

          ConfigMaps provide non-sensitive configuration data (timeouts, feature flags,
          model parameters, etc.) as opposed to secrets (API keys, credentials).

          Example configuration (application.properties):
            app-config.timeout=5000
            app-config.retries=3
            feature-flags.analyticsEnabled=true

          Example usage in YAML:
            use:
              configMaps:
                - app-config
                - feature-flags
            spec:
              bindings:
                - when: "${$config.featureFlags.analyticsEnabled == 'true'}"
                  capability: send-analytics
        items:
          type: string
          pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
          minLength: 1
          maxLength: 63
        uniqueItems: true

  CaseDefinitionSpec:
    type: object
    unevaluatedProperties: true
    properties:
      milestones:
        type: array
        description: >
          Observable progress markers derived from CaseContext.
          The Reactor evaluates milestone conditions on every context
          change and publishes MilestoneReached events.
          Milestones provide visibility, not control flow.
        items:
          $ref: "#/$defs/Milestone"
      capabilities:
        type: array
        description: >
          Capabilities define what Workers can do.
          A capability is a declared competence with a defined input/output
          contract and shared vocabulary for discovery.
        items:
          $ref: "#/$defs/Capability"
      goals:
        type: array
        description: >
          Desired end-states expressed as JQ predicates over the CaseContext.
          Goals provide outcome-oriented observability and can be used to
          determine Case completion (success/failure), without prescribing
          control flow or assigning work.
        items:
          $ref: "#/$defs/Goal"
      completion:
        $ref: "#/$defs/CaseCompletion"
        description: >
          Defines when a Case instance is considered terminally completed
          (success) or terminally failed based on Goal satisfaction and/or a
          direct JQ predicate. The Reactor evaluates completion on every
          CaseContext change and may emit CaseCompleted/CaseFailed events.
      planningStrategy:
        type: string
        description: >
          Planning strategy for this case. Options: "parallel" (default), "sequential".
          Controls how multiple eligible bindings are scheduled.
      decompositionStrategy:
        type: string
        description: >
          HTN decomposition strategy for this case. Resolved via StrategyResolver
          by name. Default: "identity".
      cbr:
        $ref: "#/$defs/Cbr"
      bindings:
        type: array
        description: >
          Bindings connect trigger conditions to worker capabilities. When a binding's
          trigger condition is met, the associated capability is invoked.
        items:
          $ref: "#/$defs/Binding"
      workers:
        type: array
        description: >
          Autonomous participants that observe CaseContext and events,
          make local decisions, and perform work.
        items:
          $ref: "#/$defs/Worker"
      _forceAgent:
        description: "TEMPORARY: forces generation of Agent class"
        $ref: "#/$defs/Agent"
      _forceAgentModel:
        description: "TEMPORARY: forces generation of AgentModel class"
        $ref: "#/$defs/AgentModel"
      _forceOpenAi:
        description: "TEMPORARY: forces generation of OpenAiModel class"
        $ref: "#/$defs/OpenAiModel"
      _forceOllama:
        description: "TEMPORARY: forces generation of OllamaModel class"
        $ref: "#/$defs/OllamaModel"
      _forceAnthropic:
        description: "TEMPORARY: forces generation of AnthropicModel class"
        $ref: "#/$defs/AnthropicModel"
      _forceMistral:
        description: "TEMPORARY: forces generation of MistralAiModel class"
        $ref: "#/$defs/MistralAiModel"
      _forceGoogleAi:
        description: "TEMPORARY: forces generation of GoogleAiGeminiModel class"
        $ref: "#/$defs/GoogleAiGeminiModel"
      authorization:
        $ref: "#/$defs/Authorization"
        description: >
          ACL grants created when a case instance of this type is started.
          Maps AclAction to groups. Absent = no ACL enforcement (NoOp default).

  Authorization:
    type: object
    description: >
      Declares which groups are granted each ACL action when a case
      of this type is created. Groups are IdP-agnostic — resolved
      via CurrentPrincipal.roles(). All fields are optional.
    unevaluatedProperties: false
    properties:
      read:
        type: array
        items: { type: string }
        description: "Groups granted READ — query case, view plan items, event log, work items"
      write:
        type: array
        items: { type: string }
        description: "Groups granted WRITE — signal, update context, assign work items"
      admin:
        type: array
        items: { type: string }
        description: "Groups granted ADMIN — start, close, suspend, resume, dispatch"
      claim:
        type: array
        items: { type: string }
        description: "Groups granted CLAIM — claim work items for execution"

  Cbr:
    type: object
    description: >
      CBR (Case-Based Reasoning) retrieval configuration. Declares how to
      extract features from the case context for similarity-based retrieval
      of past case experiences at routing time.
    required: [ features ]
    unevaluatedProperties: false
    properties:
      features:
        type: object
        description: >
          Map of feature name to JQ expression. Each expression is evaluated
          against the working layer to extract a feature value for CBR retrieval.
        additionalProperties:
          type: string
      weights:
        type: object
        description: Per-feature weight overrides for similarity scoring.
        additionalProperties:
          type: number
      topK:
        type: integer
        minimum: 1
        default: 5
        description: Maximum number of similar cases to retrieve.
      minSimilarity:
        type: number
        minimum: 0
        maximum: 1
        default: 0
        description: Minimum similarity score threshold.
      vectorWeight:
        type: number
        minimum: 0
        maximum: 1
        default: 0.5
        description: Blend factor between feature similarity and vector similarity.
      domain:
        type: string
        minLength: 1
        description: >
          MemoryDomain name for CBR retrieval. Defaults to episodicMemory.domain
          if not specified.
      caseType:
        type: string
        minLength: 1
        description: >
          CBR case type for retrieval. Defaults to the case definition name
          if not specified.
      timing:
        type: string
        enum: [ per-evaluation, case-lifetime ]
        default: per-evaluation
        description: >
          Retrieval timing strategy. 'per-evaluation' retrieves on every
          evaluation (default). 'case-lifetime' retrieves once on first access
          and caches the result for the case's lifetime.
      temporalDecayHalfLifeDays:
        type: integer
        minimum: 1
        description: >
          Half-life in days for temporal decay during retrieval. Older cases
          lose relevance via similarity *= 0.5^(age / halfLife). Null means
          no decay (backward compatible).

  Capability:
    description: >
      A capability that a Worker can perform.
      It declares what a Worker is able to do and defines the contract
      (input/output schema) for that capability.
    type: object
    required: [ name ]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        title: CapabilityName
        description: "Unique capability identifier"
      description:
        type: string
        title: CapabilityDescription
        description: "What this capability represents"
      inputProjection:
        { type: string, description: "JQ expression producing capability input from case context" }
      outputProjection:
        { type: string, description: "JQ expression producing capability output from worker result" }

  HumanTask:
    type: object
    description: >-
      A binding target that creates a WorkItem in casehub-work and resumes the case
      when the WorkItem reaches a terminal state. Inline mode requires title;
      template mode requires templateRef. The two modes are mutually exclusive.
    unevaluatedProperties: false
    oneOf:
      - required: [ title ]
        not: { required: [ templateRef ] }
      - required: [ titleExpression ]
        not: { required: [ templateRef ] }
      - required: [ templateRef ]
        not: { required: [ title, titleExpression ] }
    properties:
      title:
        type: string
        description: "WorkItem title — inline mode"
      titleExpression:
        type: string
        description: "JQ expression resolving to the WorkItem title from case context (e.g. '\"IRB Review — \" + .protocol.id')"
      templateRef:
        type: string
        description: "WorkItemTemplate reference (UUID or name) — template mode"
      inputMapping:
        type: string
        description: "JQ expression: case context → WorkItem payload"
      outputMapping:
        type: string
        description: "JQ expression: WorkItem resolution → case context updates"
      scope:
        type: string
        description: >-
          Hierarchical scope path for SLA preference resolution
          (e.g. "casehubio/devtown/pr-review"). Null resolves preferences at root scope.
          Follow the platform convention: org / app / case-type.
      scopeExpression:
        type: string
        description: "JQ expression resolving to the scope path from case context (e.g. '.trial.site.code')"
      candidateGroups:
        oneOf:
          - type: array
            items: { type: string }
            description: "Static list of groups eligible to claim this WorkItem"
          - type: string
            description: "JQ expression resolving to a list of group names from case context (e.g. \".irb.candidateGroups\")"
      candidateUsers:
        oneOf:
          - type: array
            items: { type: string }
            description: "Static list of users eligible to claim this WorkItem"
          - type: string
            description: "JQ expression resolving to a list of user IDs from case context"
      expiresIn:
        type: string
        description: "ISO 8601 duration after which the WorkItem expires (e.g. PT24H)"
      expiresInExpression:
        type: string
        description: "JQ expression resolving to an ISO-8601 duration from case context (e.g. '.trial.regulatoryDeadlineDuration')"
      claimDeadlineHours:
        type: integer
        minimum: 1
        description: "Business hours allowed to claim this WorkItem before it escalates"
      expiresAtExpression:
        type: string
        description: >
          JQ expression evaluated against the case context WORKING layer at scheduling time.
          Must produce an ISO-8601 Instant string (e.g. ".indReportingDeadline").
          Validated at YAML load time. Used to enforce an absolute deadline derived from
          domain data (e.g. ae.reportedAt + window) rather than a relative duration from
          WorkItem creation.
      outcomes:
        type: array
        items: { type: string }
        description: "Valid outcome names for this WorkItem (e.g. APPROVED, REJECTED). Enforced at completion by casehub-work."
      payloadType:
        type: string
        description: "Fully-qualified Java class name for typed payload validation via ContextBridge. Engine validates inputMapping output against this type at dispatch time."
      resolutionType:
        type: string
        description: "Fully-qualified Java class name for typed resolution validation via ContextBridge. Engine validates WorkItem resolution against this type at completion time."

  Binding:
    type: object
    required: [ on ]
    unevaluatedProperties: false
    oneOf:
      - required: [ capability ]
        not:
          required: [ subCase, humanTask ]
      - required: [ subCase ]
        not:
          required: [ capability, humanTask ]
      - required: [ humanTask ]
        not:
          required: [ capability, subCase ]
    properties:
      name: { type: string }
      on: { $ref: "#/$defs/Trigger" }
      when: { type: string, description: "JQ over context and/or event" }
      capability: { type: string }
      subCase: { $ref: "#/$defs/SubCase" }
      humanTask: { $ref: "#/$defs/HumanTask" }
      conflictResolverStrategy:
        type: string
        enum: [ LAST_WRITER_WINS, FIRST_WRITER_WINS, FAIL, DEEP_MERGE ]
        default: LAST_WRITER_WINS
        description: "Strategy for resolving concurrent writes to the same CaseContext key"
      outcomePolicy:
        $ref: "#/$defs/OutcomePolicy"
      inputProjectionOverride:
        type: string
        description: "JQ expression overriding the capability's input projection for this binding. Use for failure cascade scope reduction."
      contextWrite:
        type: object
        additionalProperties: true
        description: "Key-value pairs to write to the case context before dispatching. Prevents condition re-evaluation loops in failure cascades."
      producedKeys:
        type: array
        items:
          type: string
        description: "Context keys this binding is expected to produce. Used for static cycle detection and dependency reasoning."
      lifecycleScope:
        type: string
        enum: [ BINDING, COMPOUND, CASE ]
        default: BINDING
        description: "Scope governing worker lifetime. BINDING = single dispatch (default). COMPOUND = lives for compound duration. CASE = lives for case duration."
      participation:
        type: string
        enum: [ PARTICIPANT, COMPANION ]
        default: PARTICIPANT
        description: "PARTICIPANT blocks completion. COMPANION is a sidecar excluded from completion evaluation."
      executionMode:
        type: string
        enum: [ TRANSIENT, PERSISTENT, REINVOKED ]
        default: TRANSIENT
        description: "TRANSIENT = fire-and-forget (default). PERSISTENT = long-running virtual thread with mailbox. REINVOKED = re-invoked on each trigger with accumulated state."

  OutcomePolicy:
    type: object
    description: "Policy for handling semantic worker outcomes (DECLINED, FAILED, EXPIRED)"
    unevaluatedProperties: false
    properties:
      onDecline:
        type: string
        enum: [ REROUTE, FAULT ]
        default: REROUTE
        description: "Action when a worker returns DECLINED"
      onFailure:
        type: string
        enum: [ REROUTE, FAULT ]
        default: REROUTE
        description: "Action when a worker returns FAILED"
      onExpired:
        type: string
        enum: [ REROUTE, FAULT ]
        default: REROUTE
        description: "Action when a worker's commitment expires (not yet wired — engine#513)"
      maxRerouteAttempts:
        type: integer
        minimum: 1
        default: 3
        description: "Maximum dispatch+outcome cycles before writing REROUTES_EXHAUSTED"

  Goal:
    type: object
    required: [ name, condition ]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        description: "Unique goal identifier"
      description:
        type: string
      kind:
        type: string
        default: success
        description: "Goal kind label — built-in kinds are 'success' and 'failure'; domains may define custom kinds"
      condition:
        type: string
        description: "JQ predicate over CaseContext"

  CaseCompletion:
    type: object
    description: >
      Maps goal kinds to goal expressions. Document order determines evaluation
      priority — first satisfied expression wins. Built-in kinds (success, failure)
      have implicit terminal status mappings. Custom kinds require an explicit
      'status' field.
    properties:
      doneWhen:
        type: string
        description: "Optional JQ predicate over CaseContext as an override/shortcut"
    additionalProperties:
      $ref: "#/$defs/GoalExpression"

  ContextChangeTrigger:
    type: object
    description: "Fires when CaseContext changes."
    unevaluatedProperties: false
    properties:
      filter:
        type: string
        description: "JQ predicate over { context, event } where event is a synthetic ContextChanged envelope"
      listenLayer:
        type: string
        description: "Optional layer name; if set, binding only re-evaluates when this layer changes"
    additionalProperties: false

  CloudEventTrigger:
    description: "Fires on matching CloudEvents."
    oneOf:
      - type: string
        description: "CloudEvent type exact match"
      - type: object
        required: [ type ]
        unevaluatedProperties: false
        properties:
          type:
            type: string
            description: "CloudEvent type exact match"
          source:
            type: string
            description: "Optional exact match on CloudEvent source"
          subject:
            type: string
            description: "Optional exact match on CloudEvent subject"
          filter:
            type: string
            description: "JQ predicate over { context, event } where event is the CloudEvent envelope"
        additionalProperties: false

  ExecutionPolicy:
    type: object
    unevaluatedProperties: false
    properties:
      timeoutMs:
        type: integer
        minimum: 60000
        description: "Default timeout for a single work execution/invocation"
      retries:
        $ref: "#/$defs/RetryPolicy"
        description: "Default retry policy"

  GoalExpression:
    type: object
    unevaluatedProperties: false
    oneOf:
      - required: [ allOf ]
      - required: [ anyOf ]
    properties:
      allOf:
        type: array
        description: "All listed goals/expressions must be satisfied. Items are goal names (strings) or nested GoalExpression objects."
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/GoalExpression"
        minItems: 1
      anyOf:
        type: array
        description: "At least one listed goal/expression must be satisfied. Items are goal names (strings) or nested GoalExpression objects."
        items:
          oneOf:
            - type: string
            - $ref: "#/$defs/GoalExpression"
        minItems: 1

  Milestone:
    description: >
      Observable progress marker. The Reactor evaluates milestone
      conditions on every context change and publishes MilestoneReached
      events. Milestones provide visibility, not control flow.
    type: object
    required: [ name, condition ]
    unevaluatedProperties: false
    properties:
      name:
        type: string
        title: MilestoneName
        description: "Milestone name"
      description:
        type: string
        title: MilestoneDescription
        description: "What this milestone represents"
      condition:
        type: string
        title: MilestoneCondition
        description: "JQ expression — true means milestone is reached"
      entryCriteria:
        type: string
        description: "JQ predicate — milestone becomes ACTIVE when true (default: always true)"
      slaDuration:
        type: string
        description: "ISO-8601 duration for SLA deadline (e.g. PT2H, PT24H). Must be positive if present."
      slaStartFrom:
        type: string
        enum: [CASE_CREATED, MILESTONE_ACTIVATED, PREVIOUS_MILESTONE_COMPLETED, EVENT_OCCURRED]
        default: MILESTONE_ACTIVATED
        description: "When SLA clock starts. Only CASE_CREATED and MILESTONE_ACTIVATED are currently implemented."

  RetryPolicy:
    type: object
    unevaluatedProperties: false
    properties:
      maxAttempts:
        type: integer
        minimum: 1
        default: 3
        description: "Total attempts including the first one"
      delayMs:
        type: integer
        minimum: 0
        default: 100
        description: "Delay in milliseconds between retry attempts"

  ScheduleTrigger:
    type: object
    description: "Time-based trigger."
    unevaluatedProperties: false
    oneOf:
      - required: [ cron ]
      - required: [ every ]
    properties:
      cron:
        type: string
        description: "Cron expression (define the dialect in docs: e.g. cron/Quartz)."
      every:
        type: string
        description: "ISO-8601 duration, e.g. PT5M."
      timezone:
        type: string
        description: "IANA TZ, e.g. America/Vancouver"
    additionalProperties: false

  Trigger:
    type: object
    description: >
      Defines what the Worker observes. Exactly one of: contextChange, cloudEvent, schedule, scopeActivated.
    unevaluatedProperties: false
    oneOf:
      - required: [ contextChange ]
      - required: [ cloudEvent ]
      - required: [ schedule ]
      - required: [ scopeActivated ]
    properties:
      contextChange:
        $ref: "#/$defs/ContextChangeTrigger"
      cloudEvent:
        $ref: "#/$defs/CloudEventTrigger"
      schedule:
        $ref: "#/$defs/ScheduleTrigger"
      scopeActivated:
        $ref: "#/$defs/ScopeActivatedTrigger"

  ScopeActivatedTrigger:
    type: object
    description: "Fires when the owning scope (compound or case) becomes active. Used for lifecycle-scoped workers."
    unevaluatedProperties: false
    additionalProperties: false

  SubCase:
    description: >
      Identifies a child case definition to launch as part of a Binding's work.
      When a binding with a subCase is triggered, a child CaseInstance is spawned.
      The parent case can optionally wait for the child to complete (WAITING state)
      and merge the child's final context back into the parent context.
    type: object
    required: [ namespace, name, version ]
    unevaluatedProperties: false
    properties:
      namespace:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        minLength: 1
        maxLength: 255
        description: "Child case definition namespace"
      name:
        type: string
        pattern: ^[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$
        minLength: 1
        maxLength: 255
        description: "Child case definition name"
      version:
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
        minLength: 1
        maxLength: 50
        description: "Child case definition semantic version"
      completionStrategy:
        type: string
        enum: [ DEFAULT, CUSTOM ]
        default: DEFAULT
        description: "Strategy for determining when the child case is considered complete"
      waitForCompletion:
        type: boolean
        default: true
        description: "If true, parent transitions to WAITING until child reaches a terminal state"
      inputMapping:
        type: string
        default: "."
        description: "JQ expression to map parent CaseContext to child initial context"
      outputMapping:
        type: string
        description: "Optional JQ expression to map child final context back to parent (null = no merge)"
      maxRecursionDepth:
        type: integer
        minimum: 0
        maximum: 20
        default: 0
        description: "Maximum self-referencing depth. 0 = no recursion (default). N = allow N levels."
      groupId:
        type: string
        minLength: 1
        maxLength: 255
        description: "Groups multiple sub-case spawns under one M-of-N completion policy"
      totalInGroup:
        type: integer
        minimum: 1
        description: "Total children expected in this group"
      requiredCount:
        type: integer
        minimum: 1
        description: "How many must complete to trigger threshold (default: totalInGroup)"
      onThresholdReached:
        type: string
        enum: [ KEEP, CANCEL ]
        default: KEEP
        description: "KEEP leaves remaining children running; CANCEL stops them"

  Worker:
    description: >
      A Worker is an autonomous participant that owns one or more capabilities.
      Workers observe CaseContext and events, make local decisions,
      and perform work independently.

      A Worker may be a person, a service, a workflow, a rule,
      or an autonomous agent.
    allOf:
      - type: object
        required: [ name, capabilities ]
        unevaluatedProperties: false
        properties:
          name:
            type: string
            title: WorkerName
            minLength: 1
            maxLength: 255
            description: "Worker name"
          description:
            type: string
            title: WorkerDescription
            description: "What this worker does"
          capabilities:
            type: array
            title: WorkerCapabilities
            description: "Capabilities this Worker owns and can perform"
            minItems: 1
            items:
              type: string
          executionPolicy:
            $ref: "#/$defs/ExecutionPolicy"
            description: >
              Default execution policy for this Worker. These are defaults and may be
              overridden by workflow/state-specific settings (if present).
          sequence:
            type: array
            description: >
              Sequential composition of other workers. Each step name must reference
              a worker defined earlier in the workers list.
            items:
              type: string
      - anyOf:
          - $ref: "https://raw.githubusercontent.com/serverlessworkflow/specification/main/schema/workflow.yaml"
          - type: string
          - type: object
            required: [ agent ]
            properties:
              agent:
                $ref: "#/$defs/Agent"

  Agent:
    description: >
      AI-powered worker using LangChain4j models. Agents transform input data
      using JQ expressions, invoke an LLM with a system prompt, and transform
      the LLM response back to output data.
    type: object
    required: [ systemPrompt, inputProjection, outputProjection, model ]
    unevaluatedProperties: false
    properties:
      systemPrompt:
        type: string
        description: "System prompt sent to the LLM to define its behavior and context"
      inputProjection:
        type: string
        description: "JQ expression to transform case context into agent input"
      outputProjection:
        type: string
        description: "JQ expression to transform agent output back to case context"
      userMessageTemplate:
        type: string
        description: "Optional template for the user message. Variables are substituted from transformed input."
      model:
        $ref: "#/$defs/AgentModel"

  AgentModel:
    description: "LLM provider configuration. Exactly one provider must be specified."
    type: object
    unevaluatedProperties: false
    oneOf:
      - required: [ openai ]
      - required: [ ollama ]
      - required: [ anthropic ]
      - required: [ mistralAi ]
      - required: [ googleAiGemini ]
    properties:
      openai:
        $ref: "#/$defs/OpenAiModel"
      ollama:
        $ref: "#/$defs/OllamaModel"
      anthropic:
        $ref: "#/$defs/AnthropicModel"
      mistralAi:
        $ref: "#/$defs/MistralAiModel"
      googleAiGemini:
        $ref: "#/$defs/GoogleAiGeminiModel"

  OpenAiModel:
    type: object
    required: [ modelName ]
    unevaluatedProperties: false
    properties:
      apiKey:
        type: string
        description: |
          OpenAI API key.
          Supports JQ expressions: "${$secret.openai.apiKey}"

          Example configuration (application.properties):
            openai.apiKey=sk-...
            openai.organizationId=org-...

          Declare the secret in use.secrets for fail-fast validation:
            use:
              secrets:
                - openai

          The secret is resolved at runtime during JQ expression evaluation.
      modelName:
        type: string
        description: "Model name (e.g., gpt-4, gpt-3.5-turbo)"
      temperature:
        type: number
        minimum: 0.0
        maximum: 2.0
        description: "Sampling temperature (0.0-2.0)"
      maxTokens:
        type: integer
        minimum: 1
        description: "Maximum tokens in the response"
      topP:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Nucleus sampling parameter"
      frequencyPenalty:
        type: number
        minimum: -2.0
        maximum: 2.0
        description: "Frequency penalty (-2.0 to 2.0)"
      presencePenalty:
        type: number
        minimum: -2.0
        maximum: 2.0
        description: "Presence penalty (-2.0 to 2.0)"
      organizationId:
        type: string
        description: "OpenAI organization ID (optional)"
      baseUrl:
        type: string
        description: "Custom base URL (default: https://api.openai.com/v1)"

  OllamaModel:
    type: object
    required: [ baseUrl, modelName ]
    unevaluatedProperties: false
    properties:
      baseUrl:
        type: string
        description: "Ollama server URL (e.g., http://localhost:11434)"
      modelName:
        type: string
        description: "Model name (e.g., llama2, mistral)"
      temperature:
        type: number
        minimum: 0.0
        maximum: 2.0
        description: "Sampling temperature"
      maxTokens:
        type: integer
        minimum: 1
        description: "Maximum tokens in the response"
      topP:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Nucleus sampling parameter"
      topK:
        type: integer
        minimum: 1
        description: "Top-K sampling parameter"

  AnthropicModel:
    type: object
    required: [ modelName ]
    unevaluatedProperties: false
    properties:
      apiKey:
        type: string
        description: |
          Anthropic API key.
          Supports JQ expressions: "${$secret.anthropic.apiKey}"

          Example configuration (application.properties):
            anthropic.apiKey=sk-ant-...

          Declare the secret in use.secrets for fail-fast validation:
            use:
              secrets:
                - anthropic

          The secret is resolved at runtime during JQ expression evaluation.
      modelName:
        type: string
        description: "Model name (e.g., claude-3-sonnet-20240229)"
      version:
        type: string
        description: "API version (e.g., 2023-06-01)"
      temperature:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Sampling temperature"
      maxTokens:
        type: integer
        minimum: 1
        description: "Maximum tokens in the response"
      topP:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Nucleus sampling parameter"
      topK:
        type: integer
        minimum: 1
        description: "Top-K sampling parameter"
      baseUrl:
        type: string
        description: "Custom base URL (default: https://api.anthropic.com)"

  MistralAiModel:
    type: object
    required: [ modelName ]
    unevaluatedProperties: false
    properties:
      apiKey:
        type: string
        description: |
          Mistral AI API key.
          Supports JQ expressions: "${$secret.mistralai.apiKey}"

          Example configuration (application.properties):
            mistralai.apiKey=...

          Declare the secret in use.secrets for fail-fast validation:
            use:
              secrets:
                - mistralai

          The secret is resolved at runtime during JQ expression evaluation.
      modelName:
        type: string
        description: "Model name (e.g., mistral-large-latest)"
      temperature:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Sampling temperature"
      maxTokens:
        type: integer
        minimum: 1
        description: "Maximum tokens in the response"
      topP:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Nucleus sampling parameter"
      baseUrl:
        type: string
        description: "Custom base URL (default: https://api.mistral.ai)"

  GoogleAiGeminiModel:
    type: object
    required: [ modelName ]
    unevaluatedProperties: false
    properties:
      apiKey:
        type: string
        description: |
          Google AI API key.
          Supports JQ expressions: "${$secret.googleai.apiKey}"

          Example configuration (application.properties):
            googleai.apiKey=...

          Declare the secret in use.secrets for fail-fast validation:
            use:
              secrets:
                - googleai

          The secret is resolved at runtime during JQ expression evaluation.
      modelName:
        type: string
        description: "Model name (e.g., gemini-pro)"
      temperature:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Sampling temperature"
      maxTokens:
        type: integer
        minimum: 1
        description: "Maximum tokens in the response (called maxOutputTokens in Gemini)"
      topP:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Nucleus sampling parameter"
      topK:
        type: integer
        minimum: 1
        description: "Top-K sampling parameter"
