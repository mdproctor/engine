##
## Example: Document Processing Case
##
## Scenario: A customer submits a document that needs to be scanned (OCR),
## classified, and reviewed by a human before the case can be closed.
##
## Architecture:
##   - Worker: registered executor with capabilities + contract.
##     All execution logic lives inside Workers.
##   - Binding: connects a trigger to a Worker via capability lookup.
##     Triggers: contextChange, cloudEvent, schedule, scopeActivated.
##   - Milestone: observable progress marker. Passive — no execution.
##

dsl: "1.0.0"
namespace: casehub-examples
name: document-processing
version: "1.0.0"
types:
  - processing/document
labels:
  - example/reference

spec:

  ## ─── Capabilities ─────────────────────────────────────────────────
  capabilities:
    - name: ocr
      description: "Extracts text from document images using OCR"
      inputProjection: "{ image: .document.base64 }"
      outputProjection: "{ ocrResult: { text: .text, confidence: .confidence } }"

    - name: document-classification
      description: "Classifies documents by type and content"
      inputProjection: "{ text: .ocrResult.text }"
      outputProjection: "{ classification: { category: .category, tags: .tags } }"

    - name: notify
      description: "Sends notifications via email or Slack"
      inputProjection: '{ channel: "slack", recipient: "#case-review", message: ("Document " + .document.name + " classified as " + .classification.category) }'
      outputProjection: "{ notified: .delivered }"

    - name: validate-format
      description: "Validates document format and structure"
      inputProjection: "{ contentType: .document.contentType, size: .document.size }"
      outputProjection: "{ document: (.document + { validated: .valid }) }"

    - name: archive
      description: "Archives case data to long-term storage"
      inputProjection: "{ caseId: .caseId, data: . }"
      outputProjection: "{ archived: true }"

  ## ─── Workers ───────────────────────────────────────────────────────
  workers:
    - name: ocr-worker
      description: "Extracts text from document images using OCR"
      capabilities: [ "ocr" ]
      do:
        - extractText:
            call: http
            with:
              method: POST
              endpoint:
                uri: https://ocr-service.internal/api/extract
              body:
                image: "${ .image }"

    - name: classifier-worker
      description: "Classifies documents by type and content"
      capabilities: [ "document-classification" ]
      do:
        - classify:
            call: http
            with:
              method: POST
              endpoint:
                uri: https://classifier-service.internal/api/classify
              body:
                text: "${ .text }"

    - name: notification-worker
      description: "Sends notifications via email or Slack"
      capabilities: [ "notify" ]
      do:
        - send:
            call: http
            with:
              method: POST
              endpoint:
                uri: https://notifications.internal/api/send
              body:
                channel: "${ .channel }"
                recipient: "${ .recipient }"
                message: "${ .message }"

    - name: validator-worker
      description: "Validates document format and structure"
      capabilities: [ "validate-format" ]
      do:
        - checkFormat:
            call: http
            with:
              method: POST
              endpoint:
                uri: https://validator.internal/api/check
              body:
                contentType: "${ .contentType }"
                size: "${ .size }"

    - name: archive-worker
      description: "Archives case data to long-term storage"
      capabilities: [ "archive" ]
      do:
        - archive:
            call: http
            with:
              method: POST
              endpoint:
                uri: https://archive.internal/api/store
              body:
                caseId: "${ .caseId }"
                data: "${ .data }"

  ## ─── Bindings ──────────────────────────────────────────────────────
  bindings:
    - name: validate-on-upload
      capability: validate-format
      on:
        contextChange:
          filter: '.document != null and .document.validated == null'

    - name: extract-text
      capability: ocr
      on:
        contextChange:
          filter: '.document.validated == true and .ocrResult == null'

    - name: classify-document
      capability: document-classification
      on:
        contextChange:
          filter: '.ocrResult != null and .classification == null'

    - name: notify-ready-for-review
      capability: notify
      on:
        contextChange:
          filter: '.classification != null and .notified == null'

    - name: archive-on-resolve
      capability: archive
      on:
        contextChange:
          filter: '.status == "resolved" and .archived == null'

    - name: on-external-document
      capability: validate-format
      on:
        cloudEvent:
          type: "document.received"
          source: "upload-service"

  ## ─── Milestones ────────────────────────────────────────────────────
  milestones:
    - name: text-extracted
      description: "Document text has been successfully extracted"
      condition: '.ocrResult != null and .ocrResult.confidence > 0.8'

    - name: document-classified
      description: "Document has been classified and is ready for human review"
      condition: '.classification != null'

    - name: human-review-complete
      description: "Human reviewer has completed their assessment"
      condition: '.humanReview != null'

  ## ─── Goals & Completion ────────────────────────────────────────────
  goals:
    - name: processingComplete
      condition: '.classification != null and .humanReview != null'
      kind: success

  completion:
    success:
      allOf:
        - processingComplete
