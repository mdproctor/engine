# casehub-engine-planning integration tests — in-memory persistence, no Docker.

# Quarkus index-dependency: CDI beans from library JARs need explicit indexing.
# Required because scheduler-quartz and persistence-memory are library JARs without
# Quarkus extension descriptors — Quarkus will not scan them without this config.
quarkus.index-dependency.scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz
quarkus.index-dependency.persistence-memory.group-id=io.casehub
quarkus.index-dependency.persistence-memory.artifact-id=casehub-engine-persistence-memory
quarkus.index-dependency.engine-common.group-id=io.casehub
quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
quarkus.index-dependency.engine.group-id=io.casehub
quarkus.index-dependency.engine.artifact-id=casehub-engine
quarkus.index-dependency.casehub-platform.group-id=io.casehub
quarkus.index-dependency.casehub-platform.artifact-id=casehub-platform

# Quartz: use in-memory store
quarkus.quartz.store-type=ram


# Random port to avoid conflicts with other running services
quarkus.http.test-port=0

# Index dependency classes for CDI discovery
quarkus.index-dependency.casehub-engine.group-id=io.casehub
quarkus.index-dependency.casehub-engine.artifact-id=casehub-engine
quarkus.index-dependency.scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz

# Activate in-memory repository implementations
quarkus.arc.selected-alternatives=\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.blackboard.NoOpPreferenceProvider


# casehub-work-core is on the classpath transitively (via casehub-engine). RoundRobinStrategy
# requires a RoutingCursorStore which has no provider here — exclude it from CDI discovery.
# The proper fix is a @DefaultBean no-op RoutingCursorStore in casehub-work-core (casehubio/work#214).
quarkus.arc.exclude-types=io.casehub.work.core.strategy.RoundRobinStrategy,\
  io.casehub.platform.mock.MockCurrentPrincipal,\
  io.casehub.platform.mock.MockPreferenceProvider,\
  io.casehub.ledger.service.CaseLedgerEventCapture,\
  io.casehub.ledger.service.WorkerDecisionEventCapture

# casehub-ledger JPA entities land on the classpath via engine -> casehub-ledger.
# Provide an H2 datasource so Hibernate can start; blackboard tests use in-memory repos.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:blackboardtestdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.flyway.migrate-at-start=false

# Required by transitive CBR retention beans from casehub-neocortex-memory
casehub.cbr.retention.case-types=none
casehub.cbr.retention.domain=test
casehub.cbr.trust-retention.case-types=none
