# H2 in-memory datasource — quarkus-test-h2 configures the JDBC URL automatically
quarkus.datasource.db-kind=h2
quarkus.hibernate-orm.database.generation=none

# Index casehub-ledger so Hibernate discovers LedgerEntry base entity (JOINED inheritance)
quarkus.index-dependency.ledger.group-id=io.casehub
quarkus.index-dependency.ledger.artifact-id=casehub-ledger
quarkus.index-dependency.ledger-memory.group-id=io.casehub
quarkus.index-dependency.ledger-memory.artifact-id=casehub-ledger-memory

quarkus.arc.selected-alternatives=\
  io.casehub.ledger.memory.InMemoryLedgerMerkleFrontierRepository,\
  io.casehub.ledger.runtime.repository.jpa.JpaLedgerEntryRepository,\
  io.casehub.ledger.runtime.service.CachedTrustScoreSource

# Exclude identity enrichment beans — identity tokenisation is disabled in tests
# (casehub.ledger.identity.tokenisation.enabled=false) but Quarkus ARC validates
# their DIDResolver/ActorDIDProvider/AgentCredentialValidator deps at build time.
# These beans were added to casehub-ledger-runtime; the engine-ledger test classpath
# does not include casehub-platform-identity no-op implementations.
# DefaultOutcomeRecorder/BlockingToReactiveOutcomeRecorder inject CurrentPrincipal
# (added in casehub-ledger 0.2-SNAPSHOT post-20260529) — same root cause.
quarkus.arc.exclude-types=\
  io.casehub.ledger.runtime.service.identity.IdentityCacheInvalidator,\
  io.casehub.ledger.runtime.service.identity.ActorDIDEnricher,\
  io.casehub.ledger.runtime.service.identity.ActorIdentityValidationEnricher,\
  io.casehub.ledger.runtime.service.identity.ActorIdentityBindingObserver,\
  io.casehub.ledger.runtime.service.identity.AgentIdentityVerificationService,\
  io.casehub.ledger.runtime.service.identity.ReactiveAgentIdentityVerificationService,\
  io.casehub.ledger.runtime.service.identity.LedgerIdentityEnforcementListener,\
  io.casehub.ledger.runtime.service.DefaultOutcomeRecorder,\
  io.casehub.ledger.runtime.service.BlockingToReactiveOutcomeRecorder

# Flyway: run casehub-ledger migrations (V1000+) then our V2000
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/ledger/migration,db/engine-ledger/migration

casehub.ledger.enabled=true
casehub.ledger.hash-chain.enabled=true
casehub.ledger.decision-context.enabled=false
casehub.ledger.attestations.enabled=false
casehub.ledger.trust-score.enabled=false
casehub.ledger.identity.tokenisation.enabled=false
