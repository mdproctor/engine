# H2 in-memory datasource — quarkus-test-h2 configures the JDBC URL automatically
quarkus.datasource.db-kind=h2
quarkus.hibernate-orm.database.generation=none

# Flyway: run casehub-ledger migrations (V1000+) then our V2000
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/ledger/migration,db/migration

casehub.ledger.enabled=true
casehub.ledger.hash-chain.enabled=true
casehub.ledger.decision-context.enabled=false
casehub.ledger.attestations.enabled=false
casehub.ledger.trust-score.enabled=false
casehub.ledger.identity.tokenisation.enabled=false
