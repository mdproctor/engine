quarkus.http.test-port=0

# Quartz RAM store — no JDBC tables needed
quarkus.quartz.store-type=ram
quarkus.scheduler.start-mode=forced

# Default datasource — covers JPA entities that need @Default EntityManager.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:actorstate-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

# Named 'qhorus' datasource — satisfies qhorus and ledger entity persistence
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:actorstate-qhorus-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.qhorus.username=sa
quarkus.datasource.qhorus.password=

quarkus.hibernate-orm.qhorus.datasource=qhorus
quarkus.hibernate-orm.qhorus.packages=io.casehub.qhorus.runtime,io.casehub.ledger.runtime.model,io.casehub.ledger.model
quarkus.hibernate-orm.qhorus.database.generation=drop-and-create
quarkus.flyway.qhorus.migrate-at-start=false

# Suppress reactive datasource requirements — JDBC-only test environment
quarkus.datasource.reactive=false
quarkus.datasource.qhorus.reactive=false

# CDI — engine integration. Contributors excluded to test aggregation in isolation.
quarkus.arc.exclude-types=\
  io.casehub.actorstate.LedgerActorStateContributor,\
  io.casehub.actorstate.QhorusActorStateContributor,\
  io.casehub.actorstate.EngineActorStateContributor,\
  io.casehub.platform.mock.MockCurrentPrincipal,\
  io.casehub.platform.mock.MockGroupMembershipProvider,\
  io.casehub.qhorus.runtime.identity.QhorusInboundCurrentPrincipal

# In-memory engine SPI implementations for CDI validation
quarkus.arc.selected-alternatives=\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.MemoryPlanItemStore,\
  io.casehub.actorstate.NoOpPreferenceProvider

# Index library JARs for CDI bean discovery (no Quarkus extension descriptor)
quarkus.index-dependency.platform-api.group-id=io.casehub
quarkus.index-dependency.platform-api.artifact-id=casehub-platform-api
quarkus.index-dependency.persistence-memory.group-id=io.casehub
quarkus.index-dependency.persistence-memory.artifact-id=casehub-engine-persistence-memory
quarkus.index-dependency.scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz
quarkus.index-dependency.engine-common.group-id=io.casehub
quarkus.index-dependency.engine-common.artifact-id=casehub-engine-common
quarkus.index-dependency.engine.group-id=io.casehub
quarkus.index-dependency.engine.artifact-id=casehub-engine
