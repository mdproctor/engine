quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:goap-example;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.database.generation=none

quarkus.arc.exclude-types=\
  io.casehub.engine.common.internal.executor.RetryOrchestrator,\
  io.casehub.engine.common.internal.executor.ScheduledTriggerOrchestrator,\
  io.casehub.engine.common.internal.executor.MilestoneSLAOrchestrator,\
  io.casehub.engine.common.internal.executor.WorkerExecutionOrchestrator
